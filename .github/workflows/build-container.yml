name: Build containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DC: dmd
  VERSION: '2.113.0'
  BASE: ubuntu
  PLATFORMS: linux/amd64

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dc: dmd, version: '2.113.0', base: ubuntu, platforms: 'linux/amd64' }
          - { dc: ldc, version: '1.43.0', base: ubuntu, platforms: 'linux/amd64,linux/arm64' }
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          DC: ${{ matrix.dc }}
          VERSION: ${{ matrix.version }}
          BASE: ${{ matrix.base }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${owner}/${BASE}-${DC}" >> "$GITHUB_OUTPUT"
          if [ "$BASE" = 'ubuntu' ]; then
            echo "base_image=ubuntu:22.04" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=mcr.microsoft.com/vscode/devcontainers/base:ubuntu-22.04" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.repo }}:${{ matrix.version }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base_image }}
            DC_NAME=${{ matrix.dc }}
            DC_VERSION=${{ matrix.version }}

  qt:
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        qt_version: ['6.4.3', '6.5.3', '6.6.3', '6.7.3', '6.8.3', '6.9.3', '6.10.3', '6.11.3', '6.12.0']
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          QT_VERSION: ${{ matrix.qt_version }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/${BASE}-${DC}"
          echo "base_tag=${repo}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "qt_tag=${repo}:${VERSION}-qt${QT_VERSION}-minimal" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Qt
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.qt
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.qt_tag }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base_tag }}
            QT_VERSION=${{ matrix.qt_version }}
